<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>America First Flags - afirstflag.com</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #001433;
      color: #111;
      min-height: 100vh;
      overflow: hidden; /* keep role bar above the fold on typical desktop */
    }

    .page {
      min-height: 100vh;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #001433;
      background-image:
        linear-gradient(rgba(0, 20, 51, 0.88), rgba(0, 20, 51, 0.90)),
        url("/images/eagle.jpg");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }

    .glass {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 16px 0;
      padding: 12px 20px;
      border-radius: 16px;
      flex-shrink: 0;
    }

    .logo {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: 26px;
      color: #ff4d6d;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 24px;
    }

    nav a {
      text-decoration: none;
      color: #f4f7ff;
      font-size: 13px;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .hero {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      padding: 12px 24px;
    }

    .hero-inner {
      width: min(720px, 100%);
      padding: 28px 28px 24px;
      border-radius: 24px;
    }

    .subtitle {
      font-size: 15px;
      color: #f4f7ff;
      margin-bottom: 16px;
    }

    h1 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(26px, 4vw, 34px);
      font-weight: 700;
      color: #ff4d6d;
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-block;
      background: rgba(0, 40, 104, 0.45);
      color: #fff;
      text-decoration: none;
      padding: 11px 26px;
      border-radius: 12px;
      font-size: 14px;
      letter-spacing: 0.04em;
      border: 1px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .btn.primary {
      background: rgba(196, 30, 58, 0.55);
    }

    .btn.disabled {
      opacity: 0.7;
      pointer-events: none;
      cursor: not-allowed;
    }

    /* Role expectation — pinned above the fold at bottom of viewport */
    .role-bar {
      flex-shrink: 0;
      margin: 0 16px 12px;
      padding: 12px 16px 14px;
      border-radius: 16px;
      color: #f4f7ff;
    }

    .role-bar .label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(244, 247, 255, 0.7);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .role-sentence {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.45;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
    }

    .role-bar select {
      appearance: none;
      -webkit-appearance: none;
      background: rgba(0, 40, 104, 0.55);
      color: #f4c430;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      padding: 6px 30px 6px 10px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23f4c430' d='M1 1l5 5 5-5'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
    }

    .role-bar select:hover,
    .role-bar select:focus {
      border-color: #f4c430;
      box-shadow: 0 0 0 3px rgba(244, 196, 48, 0.18);
    }

    #role-rest {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.45;
      color: #f4f7ff;
      background: rgba(0, 0, 0, 0.22);
      border-left: 3px solid #3d8bfd;
      padding: 10px 12px;
      border-radius: 0 10px 10px 0;
      min-height: 2.8em;
    }

    .role-hint {
      margin-top: 6px;
      font-size: 11px;
      color: rgba(244, 247, 255, 0.55);
    }

    .role-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .online-chip {
      color: #fff;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11px;
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    @media (max-width: 800px) {
      body { overflow: auto; }
      .page { max-height: none; min-height: 100vh; }
      header {
        flex-direction: column;
        gap: 12px;
      }
      nav {
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
      }
      h1 { font-size: 26px; }
    }

    @media (max-height: 700px) {
      .hero-inner { padding: 18px 20px; }
      .subtitle { margin-bottom: 10px; font-size: 13px; }
      h1 { margin-bottom: 12px; font-size: 26px; }
      .btn { padding: 9px 20px; }
      #role-rest { font-size: 12px; min-height: 2.4em; padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="glass">
      <a class="logo" href="#home">afirstflag.com</a>
      <nav>
        <a href="#home">HOME</a>
        <a href="https://fuentes.store/" target="_blank" rel="noopener">SHOP</a>
        <a href="https://americafirst.plus/" target="_blank" rel="noopener">CONTENT</a>
        <a href="#gallery">GALLERY</a>
        <a href="https://chat.afirstflag.com/" target="_blank" rel="noopener">CONTACT</a>
      </nav>
    </header>

    <section class="hero" id="home">
      <div class="hero-inner glass">
        <p class="subtitle">Recognition beyond super chat, invest in the legacy, take your own side!</p>
        <h1>To him who has</h1>
        <div class="buttons" id="shop">
          <a class="btn primary" href="https://buy.stripe.com/3cI3cu9aq45JbmO2Fl2sM01" target="_blank" rel="noopener">BUY FLAG NOW</a>
          <a class="btn" href="https://chat.afirstflag.com/" target="_blank" rel="noopener">JOIN LIVE CHAT</a>
        </div>
      </div>
    </section>

    <aside class="role-bar glass" aria-label="Role expectation">
      <div class="role-top">
        <div class="label">Role expectation</div>
        <div id="online-counter" class="online-chip">Loading patriots online...</div>
      </div>
      <p class="role-sentence">
        <span>As a</span>
        <select id="role" aria-label="Choose a role">
          <option value="guest">Guest User</option>
          <option value="sponsor">Sponsor</option>
          <option value="founder">Founder</option>
          <option value="developer">Developer</option>
          <option value="buyer">Buyer</option>
          <option value="member">Member</option>
        </select>
        <span id="of">of this site,</span>
      </p>
      <p id="role-rest"></p>
      <p class="role-hint">Choose a role. The expectation updates immediately.</p>
    </aside>

      <div style="flex:1"></div>
    </div>
  </div>

  <script>
    (function () {
      const texts = {
        guest: {
          of: "of this site,",
          rest: "I expect a clear call-to-action. Descriptions and explanations of services must be clear, concise, and complete."
        },
        sponsor: {
          of: "of this site,",
          rest: "I expect my contributions are clearly and publicly visible, that my wares be in prominent and immediate vicinity of user traffic."
        },
        founder: {
          of: "of this site,",
          rest: "one whose work would have otherwise made this current implementation impossible, I expect credit to be given to my corp and in a near or adjacent position of prominence to user traffic."
        },
        developer: {
          of: "of this site,",
          rest: "I expect dedicated and disciplined release processes, with code being readily available."
        },
        buyer: {
          of: "of this site's products,",
          rest: "I expect my questions to be answered quickly and correctly. I expect a secure, efficient check-out mechanism and a tracking number."
        },
        member: {
          of: "of this site,",
          rest: "I expect our parent's Bitcoin wallet funds to be easily determined and the mechanism for transferring Bitcoin to be intuitive, secure, and effective."
        }
      };

      const roleSelect = document.getElementById("role");
      const ofSpan = document.getElementById("of");
      const restEl = document.getElementById("role-rest");

      function updateRole() {
        const data = texts[roleSelect.value];
        ofSpan.textContent = data.of;
        restEl.textContent = data.rest;
      }

      roleSelect.addEventListener("change", updateRole);
      updateRole();
    })();

    (function () {
      let visitorId = localStorage.getItem("af_visitor_id");
      if (!visitorId) {
        visitorId = "v_" + Math.random().toString(36).slice(2, 11) + Date.now();
        localStorage.setItem("af_visitor_id", visitorId);
      }

      const counterEl = document.getElementById("online-counter");

      function sendHeartbeat() {
        fetch("https://chat.afirstflag.com/api/heartbeat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ visitorId })
        }).catch(function () {});
      }

      function updateCount() {
        fetch("https://chat.afirstflag.com/api/online")
          .then(function (res) { return res.json(); })
          .then(function (data) {
            const count = data.online || 0;
            counterEl.textContent = count === 1
              ? "1 patriot online right now"
              : count + " patriots online right now";
          })
          .catch(function () {
            counterEl.textContent = "Online counter unavailable";
          });
      }

      sendHeartbeat();
      setInterval(sendHeartbeat, 20000);
      updateCount();
      setInterval(updateCount, 15000);
    })();
  </script>
</body>
</html>
