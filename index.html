<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>America First Flags - afirstflag.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Open Sans", Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      background: #fff;
    }

    .logo {
      font-family: "Roboto Slab", Georgia, serif;
      font-weight: 700;
      font-size: 28px;
      color: #c41e3a;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 36px;
    }

    nav a {
      text-decoration: none;
      color: #111;
      font-size: 14px;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .hero {
      position: relative;
      min-height: calc(100vh - 72px);
      background: #002868 url("/images/1024/27461242/image-eyaltbTIuusx2Ytp7Fn-zA.jpg") center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.33);
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      padding: 40px 20px;
      max-width: 900px;
    }

    .subtitle {
      font-size: 16px;
      color: #fdf9f9;
      margin-bottom: 22px;
    }

    h1 {
      font-family: "Roboto Slab", Georgia, serif;
      font-size: 36px;
      color: #c41e3a;
      margin-bottom: 28px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      background: #002868;
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 6px;
      font-size: 14px;
      letter-spacing: 0.04em;
      border: none;
    }

    .btn.disabled {
      opacity: 0.75;
      pointer-events: none;
      cursor: not-allowed;
    }

    #online-counter {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: #002868;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      border: 2px solid #c41e3a;
      z-index: 9998;
    }

    @media (max-width: 800px) {
      header {
        flex-direction: column;
        gap: 14px;
      }
      nav {
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
      }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="#home">afirstflag.com</a>
    <nav>
      <a href="#home">HOME</a>
      <a href="#shop">SHOP</a>
      <a href="#reviews">REVIEWS</a>
      <a href="#gallery">GALLERY</a>
      <a href="https://chat.afirstflag.com/" target="_blank" rel="noopener">CONTACT</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <div class="hero-inner">
      <p class="subtitle">Your home for America's finest collector flags, coins, and community with bipolar AI</p>
      <h1>Welcome to afirstflag.com</h1>
      <div class="buttons" id="shop">
        <a class="btn" href="https://buy.stripe.com/3cI3cu9aq45JbmO2Fl2sM01" target="_blank" rel="noopener">BUY FLAG NOW</a>
        <a class="btn disabled" href="#" aria-disabled="true">BUY COIN NOW - COMING SOON</a>
      </div>
    </div>
  </section>

  <div id="online-counter">Loading patriots online...</div>

  <script>
    (function () {
      let visitorId = localStorage.getItem("af_visitor_id");
      if (!visitorId) {
        visitorId = "v_" + Math.random().toString(36).slice(2, 11) + Date.now();
        localStorage.setItem("af_visitor_id", visitorId);
      }

      const counterEl = document.getElementById("online-counter");

      function sendHeartbeat() {
        fetch("https://chat.afirstflag.com/api/heartbeat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ visitorId })
        }).catch(function () {});
      }

      function updateCount() {
        fetch("https://chat.afirstflag.com/api/online")
          .then(function (res) { return res.json(); })
          .then(function (data) {
            const count = data.online || 0;
            counterEl.textContent = count === 1
              ? "1 patriot online right now"
              : count + " patriots online right now";
          })
          .catch(function () {
            counterEl.textContent = "Online counter unavailable";
          });
      }

      sendHeartbeat();
      setInterval(sendHeartbeat, 20000);
      updateCount();
      setInterval(updateCount, 15000);
    })();
  </script>
</body>
</html>
