<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>America First Flags - afirstflag.com</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #001433;
      color: #111;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      background-color: #001433;
      background-image:
        linear-gradient(rgba(0, 20, 51, 0.88), rgba(0, 20, 51, 0.90)),
        url("/images/eagle.jpg");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }

    .glass {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px;
      padding: 16px 24px;
      border-radius: 16px;
    }

    .logo {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: #ff4d6d;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      text-decoration: none;
      color: #f4f7ff;
      font-size: 14px;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .hero {
      min-height: calc(100vh - 120px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      padding: 24px;
    }

    .hero-inner {
      width: min(760px, 100%);
      padding: 48px 32px;
      border-radius: 24px;
    }

    .subtitle {
      font-size: 16px;
      color: #f4f7ff;
      margin-bottom: 22px;
    }

    h1 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: #ff4d6d;
      margin-bottom: 28px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      background: rgba(0, 40, 104, 0.45);
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 14px;
      letter-spacing: 0.04em;
      border: 1px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .btn.primary {
      background: rgba(196, 30, 58, 0.55);
    }

    .btn.disabled {
      opacity: 0.7;
      pointer-events: none;
      cursor: not-allowed;
    }

    #online-counter {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 9998;
    }

    @media (max-width: 800px) {
      header {
        flex-direction: column;
        gap: 14px;
      }
      nav {
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
      }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="glass">
      <a class="logo" href="#home">afirstflag.com</a>
      <nav>
        <a href="#home">HOME</a>
        <a href="https://fuentes.store/" target="_blank" rel="noopener">SHOP</a>
        <a href="#reviews">REVIEWS</a>
        <a href="#gallery">GALLERY</a>
        <a href="https://chat.afirstflag.com/" target="_blank" rel="noopener">CONTACT</a>
      </nav>
    </header>

    <section class="hero" id="home">
      <div class="hero-inner glass">
        <p class="subtitle">Recognition beyond super chats, invest in the legacy, take your own side!</p>
        <h1>To him who has</h1>
        <div class="buttons" id="shop">
          <a class="btn primary" href="https://buy.stripe.com/3cI3cu9aq45JbmO2Fl2sM01" target="_blank" rel="noopener">BUY FLAG NOW</a>
          <a class="btn" href="https://chat.afirstflag.com/" target="_blank" rel="noopener">JOIN LIVE CHAT</a>
        </div>
      </div>
    </section>
  </div>

  <div id="online-counter" class="glass">Loading patriots online...</div>

  <script>
    (function () {
      let visitorId = localStorage.getItem("af_visitor_id");
      if (!visitorId) {
        visitorId = "v_" + Math.random().toString(36).slice(2, 11) + Date.now();
        localStorage.setItem("af_visitor_id", visitorId);
      }

      const counterEl = document.getElementById("online-counter");

      function sendHeartbeat() {
        fetch("https://chat.afirstflag.com/api/heartbeat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ visitorId })
        }).catch(function () {});
      }

      function updateCount() {
        fetch("https://chat.afirstflag.com/api/online")
          .then(function (res) { return res.json(); })
          .then(function (data) {
            const count = data.online || 0;
            counterEl.textContent = count === 1
              ? "1 patriot online right now"
              : count + " patriots online right now";
          })
          .catch(function () {
            counterEl.textContent = "Online counter unavailable";
          });
      }

      sendHeartbeat();
      setInterval(sendHeartbeat, 20000);
      updateCount();
      setInterval(updateCount, 15000);
    })();
  </script>
</body>
</html>
