<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>America First Flags - afirstflag.com</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #e6ebf3;
      --text: #1b2a4a;
      --muted: #4d5d7a;
      --red: #c41e3a;
      --navy: #002868;
      --shadow-dark: #c5ccd8;
      --shadow-light: #ffffff;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .neo {
      background: var(--bg);
      border: none;
      box-shadow:
        10px 10px 20px var(--shadow-dark),
        -10px -10px 20px var(--shadow-light);
    }

    .neo-inset {
      background: var(--bg);
      box-shadow:
        inset 8px 8px 16px var(--shadow-dark),
        inset -8px -8px 16px var(--shadow-light);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 20px;
      padding: 18px 28px;
      border-radius: 24px;
    }

    .logo {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      font-size: 28px;
      color: var(--red);
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 12px;
    }

    nav a {
      text-decoration: none;
      color: var(--navy);
      font-size: 13px;
      letter-spacing: 0.08em;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 14px;
      background: var(--bg);
      box-shadow:
        5px 5px 10px var(--shadow-dark),
        -5px -5px 10px var(--shadow-light);
    }

    nav a:hover {
      box-shadow:
        inset 4px 4px 8px var(--shadow-dark),
        inset -4px -4px 8px var(--shadow-light);
    }

    .hero {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .hero-inner {
      width: min(760px, 100%);
      padding: 56px 36px;
      border-radius: 32px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 22px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 36px;
      color: var(--red);
      margin-bottom: 32px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .btn {
      display: inline-block;
      background: var(--bg);
      color: var(--navy);
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 16px;
      font-size: 14px;
      letter-spacing: 0.06em;
      font-weight: 700;
      border: none;
      box-shadow:
        8px 8px 16px var(--shadow-dark),
        -8px -8px 16px var(--shadow-light);
    }

    .btn.primary {
      color: var(--red);
    }

    .btn.disabled {
      color: var(--muted);
      box-shadow:
        inset 6px 6px 12px var(--shadow-dark),
        inset -6px -6px 12px var(--shadow-light);
      pointer-events: none;
      cursor: not-allowed;
    }

    .btn:not(.disabled):hover {
      box-shadow:
        inset 6px 6px 12px var(--shadow-dark),
        inset -6px -6px 12px var(--shadow-light);
    }

    #online-counter {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: var(--navy);
      padding: 12px 18px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      z-index: 9998;
    }

    @media (max-width: 800px) {
      header {
        flex-direction: column;
        gap: 16px;
      }
      nav {
        flex-wrap: wrap;
        justify-content: center;
      }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="neo">
      <a class="logo" href="#home">afirstflag.com</a>
      <nav>
        <a href="#home">HOME</a>
        <a href="#shop">SHOP</a>
        <a href="#reviews">REVIEWS</a>
        <a href="#gallery">GALLERY</a>
        <a href="https://chat.afirstflag.com/" target="_blank" rel="noopener">CONTACT</a>
      </nav>
    </header>

    <section class="hero" id="home">
      <div class="hero-inner neo">
        <p class="subtitle">Your home for America's finest collector flags, coins, and community with bipolar AI</p>
        <h1>Welcome to afirstflag.com</h1>
        <div class="buttons" id="shop">
          <a class="btn primary" href="https://buy.stripe.com/3cI3cu9aq45JbmO2Fl2sM01" target="_blank" rel="noopener">BUY FLAG NOW</a>
          <a class="btn disabled" href="#" aria-disabled="true">BUY COIN NOW - COMING SOON</a>
        </div>
      </div>
    </section>
  </div>

  <div id="online-counter" class="neo">Loading patriots online...</div>

  <script>
    (function () {
      let visitorId = localStorage.getItem("af_visitor_id");
      if (!visitorId) {
        visitorId = "v_" + Math.random().toString(36).slice(2, 11) + Date.now();
        localStorage.setItem("af_visitor_id", visitorId);
      }

      const counterEl = document.getElementById("online-counter");

      function sendHeartbeat() {
        fetch("https://chat.afirstflag.com/api/heartbeat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ visitorId })
        }).catch(function () {});
      }

      function updateCount() {
        fetch("https://chat.afirstflag.com/api/online")
          .then(function (res) { return res.json(); })
          .then(function (data) {
            const count = data.online || 0;
            counterEl.textContent = count === 1
              ? "1 patriot online right now"
              : count + " patriots online right now";
          })
          .catch(function () {
            counterEl.textContent = "Online counter unavailable";
          });
      }

      sendHeartbeat();
      setInterval(sendHeartbeat, 20000);
      updateCount();
      setInterval(updateCount, 15000);
    })();
  </script>
</body>
</html>
